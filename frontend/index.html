<!DOCTYPE html>
<html>

<head>
    <title>SafeHer Route</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #controls {
            padding: 10px;
            background: white;
            position: relative;
            z-index: 1000;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 250px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #map {
            height: 90vh;
            width: 100%;
        }

        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            width: 250px;
            z-index: 2000;
        }

        .suggestions div {
            padding: 6px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <button onclick="checkMySafety()">Check My Safety</button>

    <div id="controls">
        <input type="text" id="start" placeholder="Current Location" oninput="searchLocation(this.value,'start')">
        <button onclick="detectLocation()">Use My Location</button>

        <input type="text" id="end" placeholder="Destination" oninput="searchLocation(this.value,'end')">
        <button onclick="getRoute()">Find Route</button>

        <div id="startSuggestions" class="suggestions"></div>
        <div id="endSuggestions" class="suggestions"></div>
    </div>

    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_BASE = "https://iamsafee.onrender.com";

        const map = L.map('map').setView([28.6139, 77.2090], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        /* 🔥 FIXED: define safetyLayer */
        let safetyLayer = L.layerGroup().addTo(map);

        let selectedStart = null;
        let selectedEnd = null;
        let routeLayer = null;

        /* ================= HEATMAP + RSS ================= */

        async function loadSafety() {
            try {
                const res = await fetch(`${API_BASE}/heatmap`);
                const data = await res.json();

                safetyLayer.clearLayers();

                // === RSS NEIGHBOURHOOD CIRCLES ===
                data.areas.forEach(area => {

                    let color =
                        area.score >= 8 ? "#800080" :
                            area.score >= 6 ? "#ff0000" :
                                area.score >= 4 ? "#ffcc00" :
                                    "#00cc44";

                    L.circle([area.lat, area.lng], {
                        radius: 3000,
                        fillColor: color,
                        fillOpacity: 0.55,
                        color: color,
                        weight: 1
                    }).addTo(safetyLayer)
                        .bindPopup(`<b>${area.area}</b><br>Safety Score: ${area.score}`);
                });

                // === GRID HEATMAP ===
                data.grid.forEach(cell => {
                    if (cell.score <= 0) return;

                    L.circle([cell.lat, cell.lng], {
                        radius: 1200,
                        fillColor: "#87CEFA",
                        fillOpacity: 0.25,
                        stroke: false
                    }).addTo(safetyLayer);
                });

            } catch (err) {
                console.error("Safety load error:", err);
            }
        }

        loadSafety();

        /* ================= AUTOCOMPLETE ================= */

        async function searchLocation(query, type) {
            if (query.length < 3) return;

            const res = await fetch(
                `https://nominatim.openstreetmap.org/search?format=json&q=${query}`
            );
            const data = await res.json();

            const box = document.getElementById(
                type === 'start' ? 'startSuggestions' : 'endSuggestions'
            );

            box.innerHTML = '';

            data.slice(0, 5).forEach(place => {
                const div = document.createElement('div');
                div.innerText = place.display_name;

                div.onclick = () => {
                    document.getElementById(type).value = place.display_name;

                    const coords = [parseFloat(place.lon), parseFloat(place.lat)];

                    if (type === 'start') selectedStart = coords;
                    else selectedEnd = coords;

                    L.marker([place.lat, place.lon]).addTo(map);

                    box.innerHTML = '';
                };

                box.appendChild(div);
            });
        }

        /* ================= DETECT LOCATION ================= */

        function detectLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation not supported");
                return;
            }

            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                selectedStart = [lon, lat];

                map.setView([lat, lon], 14);

                L.marker([lat, lon]).addTo(map)
                    .bindPopup("You are here").openPopup();

                const res = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
                );
                const data = await res.json();

                document.getElementById("start").value = data.display_name;
            });
        }

        /* ================= ROUTE ================= */

        async function getRoute() {
            if (!selectedStart || !selectedEnd) {
                alert("Select both locations");
                return;
            }

            const url = `${API_BASE}/route?start_lon=${selectedStart[0]}&start_lat=${selectedStart[1]}&end_lon=${selectedEnd[0]}&end_lat=${selectedEnd[1]}`;

            const response = await fetch(url);
            const data = await response.json();

            if (!data.route1) {
                alert("No route found");
                return;
            }

            if (routeLayer) map.removeLayer(routeLayer);

            const coords = data.route1.coords.map(c => [c[1], c[0]]);

            routeLayer = L.polyline(coords, {
                color: "blue",
                weight: 6
            }).addTo(map);

            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
        }

        /* ================= SAFETY ================= */

        async function checkMySafety() {
            if (!selectedStart) {
                alert("Use location first");
                return;
            }

            const lat = selectedStart[1];
            const lon = selectedStart[0];

            const response = await fetch(
                `${API_BASE}/location_safety?lat=${lat}&lon=${lon}`
            );
            const data = await response.json();

            alert("Your Safety Score: " + data.safety_score + " / 10");
        }
    </script>

</body>

</html>
