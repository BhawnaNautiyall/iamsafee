<!DOCTYPE html>
<html>

<head>
    <title>SafeHer Route</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #controls {
            padding: 10px;
            background: white;
            position: relative;
            z-index: 1000;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 250px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #map {
            height: 90vh;
            width: 100%;
        }

        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            width: 250px;
            z-index: 2000;
        }

        .suggestions div {
            padding: 6px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #f0f0f0;
        }

        .leaflet-control {
            z-index: 10000 !important;
        }

        .legend-box {
            background: white;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            line-height: 20px;
            min-width: 190px;
        }
    </style>
</head>

<body>

    <button onclick="checkMySafety()">Check My Safety</button>

    <div id="controls">
        <input type="text" id="start" placeholder="Current Location">
        <button onclick="detectLocation()">Use My Location</button>

        <input type="text" id="end" placeholder="Destination">
        <button onclick="getRoute()">Find Route</button>

        <div style="margin-top:8px;">
            <button onclick="showFastest()">Fastest</button>
            <button onclick="showSafest()">Safest</button>
            <button onclick="showBalanced()">Balanced</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS (IMPORTANT: Before your script) -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_BASE = "https://iamsafee.onrender.com";

        // Initialize map AFTER Leaflet loads
        const map = L.map('map').setView([28.6139, 77.2090], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedStart = null;
        let selectedEnd = null;

        let fastLayer, safeLayer, balancedLayer;

        /* ================= LOAD SAFETY ================= */

        async function loadSafety() {
            try {
                const res = await fetch(`${API_BASE}/heatmap`);
                const data = await res.json();

                data.grid.forEach(cell => {
                    if (cell.score <= 1) return;

                    let color = cell.score > 8 ? "#4B0082"
                        : cell.score > 4 ? "#87CEFA"
                            : "#FFB6C1";

                    L.circle([cell.lat, cell.lng], {
                        radius: 900,
                        fillColor: color,
                        fillOpacity: 0.6,
                        stroke: false
                    }).addTo(map);
                });
            } catch (err) {
                console.error("Heatmap error:", err);
            }
        }

        loadSafety();

        /* ================= ROUTE ================= */

        async function getRoute() {
            if (!selectedStart || !selectedEnd) {
                alert("Select both start and destination");
                return;
            }

            try {
                const url = `${API_BASE}/route?start_lon=${selectedStart[0]}&start_lat=${selectedStart[1]}&end_lon=${selectedEnd[0]}&end_lat=${selectedEnd[1]}`;

                const response = await fetch(url);
                const data = await response.json();

                if (!data.route1) {
                    alert("No route found");
                    return;
                }

                if (fastLayer) map.removeLayer(fastLayer);

                const coords = data.route1.coords.map(c => [c[1], c[0]]);

                fastLayer = L.polyline(coords, {
                    color: "blue",
                    weight: 5
                }).addTo(map);

                map.fitBounds(fastLayer.getBounds());

            } catch (error) {
                console.error("Route error:", error);
                alert("Error fetching route");
            }
        }

        /* ================= SAFETY CHECK ================= */

        async function checkMySafety() {
            if (!selectedStart) {
                alert("Use location first");
                return;
            }

            const lat = selectedStart[1];
            const lon = selectedStart[0];

            try {
                const response = await fetch(`${API_BASE}/location_safety?lat=${lat}&lon=${lon}`);
                const data = await response.json();

                alert("Your Safety Score: " + data.safety_score + " / 10");
            } catch (error) {
                alert("Error checking safety");
            }
        }

        /* ================= LOCATION ================= */

        function detectLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation not supported");
                return;
            }

            navigator.geolocation.getCurrentPosition(pos => {
                selectedStart = [pos.coords.longitude, pos.coords.latitude];

                map.setView([pos.coords.latitude, pos.coords.longitude], 14);

                L.marker([pos.coords.latitude, pos.coords.longitude])
                    .addTo(map)
                    .bindPopup("You are here")
                    .openPopup();
            });
        }
    </script>

</body>

</html>
