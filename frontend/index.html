<!DOCTYPE html>
<html>

<head>
    <title>SafeHer Route</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #controls {
            padding: 10px;
            background: white;
            position: relative;
            z-index: 1000;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 250px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #map {
            height: 90vh;
        }

        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            width: 250px;
            z-index: 2000;
        }

        .suggestions div {
            padding: 6px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #f0f0f0;
        }

        .leaflet-control {
            z-index: 10000 !important;
        }

        .legend-box {
            background: white;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            line-height: 20px;
            min-width: 190px;
        }
    </style>
</head>

<body>
    <button onclick="checkMySafety()">Check My Safety</button>

    <div id="controls">
        <input type="text" id="start" placeholder="Current Location" oninput="searchLocation(this.value, 'start')">
        <button onclick="detectLocation()">Use My Location</button>

        <input type="text" id="end" placeholder="Destination" oninput="searchLocation(this.value, 'end')">
        <button onclick="getRoute()">Find Route</button>

        <div style="margin-top:8px;">
            <button onclick="showFastest()">Fastest</button>
            <button onclick="showSafest()">Safest</button>
            <button onclick="showBalanced()">Balanced</button>
        </div>

        <div id="startSuggestions" class="suggestions"></div>
        <div id="endSuggestions" class="suggestions"></div>
    </div>

    <div id="map"></div>

    <script>

        const API_BASE = "https://iamsafee.onrender.com";

        const map = L.map('map').setView([28.6139, 77.2090], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedStart = null;
        let selectedEnd = null;

        let fastLayer, safeLayer, balancedLayer;

        /* ================= LOAD SAFETY ================= */

        async function loadSafety() {

            const res = await fetch(`${API_BASE}/heatmap`);
            const data = await res.json();

            data.grid.forEach(cell => {
                let color = null;
                let opacity = 0;

                if (cell.score > 8) { color = "#4B0082"; opacity = 0.8; }
                else if (cell.score > 4) { color = "#87CEFA"; opacity = 0.7; }
                else if (cell.score > 1) { color = "#FFB6C1"; opacity = 0.6; }
                else return;

                L.circle([cell.lat, cell.lng], {
                    radius: 900,
                    fillColor: color,
                    fillOpacity: opacity,
                    stroke: false
                }).addTo(map);
            });

            data.areas.forEach(area => {

                let color;
                if (area.score > 7) color = "#ff0000";
                else if (area.score > 4) color = "#ffcc00";
                else color = "#00cc44";

                L.circle([area.lat, area.lng], {
                    radius: 500 + (area.score * 120),
                    fillColor: color,
                    fillOpacity: 0.85,
                    stroke: false
                }).addTo(map)
                    .bindPopup(`<b>${area.area}</b><br>RSS Score: ${area.score}`);
            });
        }

        loadSafety();

        /* ================= ROUTE ================= */

        async function getRoute() {

            if (!selectedStart || !selectedEnd) {
                alert("Select both start and destination properly");
                return;
            }

            const url = `${API_BASE}/route?start_lon=${selectedStart[0]}&start_lat=${selectedStart[1]}&end_lon=${selectedEnd[0]}&end_lat=${selectedEnd[1]}`;

            try {

                const response = await fetch(url);
                const data = await response.json();

                if (!data.route1) {
                    alert("No routes found");
                    return;
                }

                if (fastLayer) map.removeLayer(fastLayer);
                if (safeLayer) map.removeLayer(safeLayer);
                if (balancedLayer) map.removeLayer(balancedLayer);

                const fastestCoords = data.route1.coords.map(c => [c[1], c[0]]);
                const safestCoords = data.route2 ? data.route2.coords.map(c => [c[1], c[0]]) : fastestCoords;
                const balancedCoords = data.route3 ? data.route3.coords.map(c => [c[1], c[0]]) : fastestCoords;

                fastLayer = L.polyline(fastestCoords, { color: "blue", weight: 5, opacity: 0.4 }).addTo(map);
                safeLayer = L.polyline(safestCoords, { color: "green", weight: 6, opacity: 1 }).addTo(map);
                balancedLayer = L.polyline(balancedCoords, { color: "orange", weight: 5, dashArray: "6,6", opacity: 0.5 }).addTo(map);

                map.fitBounds(fastLayer.getBounds());

            } catch (error) {
                console.error("Route error:", error);
                alert("Error fetching route");
            }
        }

        /* ================= SAFETY ================= */

        async function checkMySafety() {

            if (!selectedStart) {
                alert("Use 'Use My Location' first");
                return;
            }

            const lat = selectedStart[1];
            const lon = selectedStart[0];

            const response = await fetch(`${API_BASE}/location_safety?lat=${lat}&lon=${lon}`);
            const data = await response.json();

            alert("Your Safety Score: " + data.safety_score + " / 10");
        }

    </script>


</body>

</html>
