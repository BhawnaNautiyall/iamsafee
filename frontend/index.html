<!DOCTYPE html>
<html>

<head>
    <title>SafeHer Route</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #controls {
            padding: 10px;
            background: white;
            position: relative;
            z-index: 1000;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 250px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #map {
            height: 90vh;
        }

        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            width: 250px;
            z-index: 2000;
        }

        .suggestions div {
            padding: 6px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #f0f0f0;
        }

        .leaflet-control {
            z-index: 10000 !important;
        }

        .legend-box {
            background: white;
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            line-height: 20px;
            min-width: 190px;
        }
    </style>
</head>

<body>
    <button onclick="checkMySafety()">Check My Safety</button>

    <div id="controls">
        <input type="text" id="start" placeholder="Current Location" oninput="searchLocation(this.value, 'start')">
        <button onclick="detectLocation()">Use My Location</button>

        <input type="text" id="end" placeholder="Destination" oninput="searchLocation(this.value, 'end')">
        <button onclick="getRoute()">Find Route</button>

        <div style="margin-top:8px;">
            <button onclick="showFastest()">Fastest</button>
            <button onclick="showSafest()">Safest</button>
            <button onclick="showBalanced()">Balanced</button>
        </div>

        <div id="startSuggestions" class="suggestions"></div>
        <div id="endSuggestions" class="suggestions"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        const map = L.map('map').setView([28.6139, 77.2090], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedStart = null;
        let selectedEnd = null;

        let fastLayer, safeLayer, balancedLayer;

        /* ================= LOAD SAFETY ================= */

        async function loadSafety() {

            const res = await fetch("http://127.0.0.1:8000/heatmap");
            const data = await res.json();

            // GRID
            data.grid.forEach(cell => {
                let color = null;
                let opacity = 0;

                if (cell.score > 8) { color = "#4B0082"; opacity = 0.8; }
                else if (cell.score > 4) { color = "#87CEFA"; opacity = 0.7; }
                else if (cell.score > 1) { color = "#FFB6C1"; opacity = 0.6; }
                else return;

                L.circle([cell.lat, cell.lng], {
                    radius: 900,
                    fillColor: color,
                    fillOpacity: opacity,
                    stroke: false
                }).addTo(map);
            });

            // RSS AREAS
            data.areas.forEach(area => {

                let color;
                if (area.score > 7) color = "#ff0000";
                else if (area.score > 4) color = "#ffcc00";
                else color = "#00cc44";

                L.circle([area.lat, area.lng], {
                    radius: 500 + (area.score * 120),
                    fillColor: color,
                    fillOpacity: 0.85,
                    stroke: false
                }).addTo(map)
                    .bindPopup(`<b>${area.area}</b><br>RSS Score: ${area.score}`);
            });

            // LEGEND
            const legend = L.control({ position: "topright" });

            legend.onAdd = function () {
                const div = L.DomUtil.create("div", "legend-box");

                div.innerHTML = `
            <b>Neighbourhood Layer</b><br>
            <span style="color:#4B0082;">●</span> High Risk Area<br>
            <span style="color:#87CEFA;">●</span> Medium Risk<br>
            <span style="color:#FFB6C1;">●</span> Safer Area<br><br>

            <b>RSS Crime Zones</b><br>
            <span style="color:#ff0000;">●</span> High Crime (7+)<br>
            <span style="color:#ffcc00;">●</span> Moderate Crime (4–7)<br>
            <span style="color:#00cc44;">●</span> Lower Crime (0–4)
        `;
                return div;
            };

            legend.addTo(map);
        }

        loadSafety();

        /* ================= GEOLOCATION ================= */

        function detectLocation() {
            navigator.geolocation.getCurrentPosition(position => {

                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                selectedStart = [lon, lat];

                document.getElementById("start").value = lat + "," + lon;

                map.setView([lat, lon], 14);

                L.marker([lat, lon]).addTo(map)
                    .bindPopup("You are here")
                    .openPopup();
            });
        }

        /* ================= SEARCH ================= */

        async function searchLocation(query, type) {

            if (query.length < 3) return;

            const response = await fetch(
                `https://nominatim.openstreetmap.org/search?format=json&q=${query}`
            );

            const results = await response.json();

            const suggestionBox = document.getElementById(type + "Suggestions");
            suggestionBox.innerHTML = "";

            results.slice(0, 5).forEach(place => {

                const div = document.createElement("div");
                div.innerText = place.display_name;

                div.onclick = () => {

                    document.getElementById(type).value = place.display_name;
                    suggestionBox.innerHTML = "";

                    if (type === "start")
                        selectedStart = [parseFloat(place.lon), parseFloat(place.lat)];
                    else
                        selectedEnd = [parseFloat(place.lon), parseFloat(place.lat)];
                };

                suggestionBox.appendChild(div);
            });
        }

        /* ================= ROUTE (3 OSRM ALTERNATIVES) ================= */

        async function getRoute() {

            if (!selectedStart || !selectedEnd) {
                alert("Select both start and destination properly");
                return;
            }

            const url = `http://127.0.0.1:8000/route?start_lon=${selectedStart[0]}&start_lat=${selectedStart[1]}&end_lon=${selectedEnd[0]}&end_lat=${selectedEnd[1]}`;

            try {

                const response = await fetch(url);
                const data = await response.json();

                if (!data.route1) {
                    alert("No routes found");
                    return;
                }

                // Remove old layers
                if (fastLayer) map.removeLayer(fastLayer);
                if (safeLayer) map.removeLayer(safeLayer);
                if (balancedLayer) map.removeLayer(balancedLayer);

                // Always exists
                const fastestCoords = data.route1.coords.map(c => [c[1], c[0]]);

                // If route2 not available → fallback to route1
                const safestCoords = data.route2
                    ? data.route2.coords.map(c => [c[1], c[0]])
                    : fastestCoords;

                // If route3 not available → fallback to route1
                const balancedCoords = data.route3
                    ? data.route3.coords.map(c => [c[1], c[0]])
                    : fastestCoords;

                fastLayer = L.polyline(fastestCoords, {
                    color: "blue",
                    weight: 5,
                    opacity: 0.4
                }).addTo(map);

                safeLayer = L.polyline(safestCoords, {
                    color: "green",
                    weight: 6,
                    opacity: 1
                }).addTo(map);

                balancedLayer = L.polyline(balancedCoords, {
                    color: "orange",
                    weight: 5,
                    dashArray: "6,6",
                    opacity: 0.5
                }).addTo(map);

                map.fitBounds(fastLayer.getBounds());

            } catch (error) {
                console.error("Route error:", error);
                alert("Error fetching route");
            }
        }


        /* ================= TOGGLE ================= */

        function showFastest() {
            if (fastLayer) fastLayer.setStyle({ opacity: 1 });
            if (safeLayer) safeLayer.setStyle({ opacity: 0.2 });
            if (balancedLayer) balancedLayer.setStyle({ opacity: 0.2 });
        }

        function showSafest() {
            if (safeLayer) safeLayer.setStyle({ opacity: 1 });
            if (fastLayer) fastLayer.setStyle({ opacity: 0.2 });
            if (balancedLayer) balancedLayer.setStyle({ opacity: 0.2 });
        }

        function showBalanced() {
            if (balancedLayer) balancedLayer.setStyle({ opacity: 1 });
            if (fastLayer) fastLayer.setStyle({ opacity: 0.2 });
            if (safeLayer) safeLayer.setStyle({ opacity: 0.2 });
        }

        async function checkMySafety() {

            if (!selectedStart) {
                alert("Use 'Use My Location' first");
                return;
            }

            const lat = selectedStart[1];
            const lon = selectedStart[0];

            const response = await fetch(
                `http://127.0.0.1:8000/location_safety?lat=${lat}&lon=${lon}`
            );

            const data = await response.json();

            alert("Your Safety Score: " + data.safety_score + " / 10");
        }


    </script>

</body>

</html>
